<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="200" viewBox="0 0 1000 200" preserveAspectRatio="xMidYMid meet">

  <defs>
    <!-- Animated gradient for the outer frame -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4d4d">
        <animate attributeName="stop-color"
                 values="#ff4d4d; #ff9a4d; #ffd24d; #8cf04a; #4dd2ff; #b46dff; #ff4d4d"
                 dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4dd2ff">
        <animate attributeName="stop-color"
                 values="#4dd2ff; #b46dff; #ff4d4d; #ff9a4d; #ffd24d; #8cf04a; #4dd2ff"
                 dur="12s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8cf04a">
        <animate attributeName="stop-color"
                 values="#8cf04a; #ff4d4d; #ff9a4d; #ffd24d; #4dd2ff; #b46dff; #8cf04a"
                 dur="12s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main glowing outer frame -->
  <rect x="10" y="10" rx="20" ry="20" width="980" height="180"
        fill="transparent" stroke="url(#grad)" stroke-width="6" filter="url(#soft)" />

  <!-- Inner thin frame -->
  <rect x="26" y="26" rx="16" ry="16" width="948" height="148"
        fill="transparent" stroke="url(#grad)" stroke-width="3" />

  <!-- TEXT INSIDE THE FRAME -->
  <g font-family="Inter, Arial, sans-serif" text-anchor="middle" fill="#ffffff">
    <text x="500" y="95" font-size="30" font-weight="700">
      🎉 Hey there! I'm Nethmin Tharusha
    </text>
    <text x="500" y="135" font-size="18" fill-opacity="0.85">
      Computer Engineering Undergraduate — University of Peradeniya
    </text>
  </g>
</svg>

